name: Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
      - uses: gradle/actions/setup-gradle@v6.4.1
      - run: ./gradlew :app:assembleDebug :app:assembleRelease
      - name: Release signieren
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SIGNING_STORE_B64: ${{ secrets.SIGNING_STORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.SIGNING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          store="$RUNNER_TEMP/lichtbild.p12"
          trap 'rm -f "$store"' EXIT
          printf '%s' "$SIGNING_STORE_B64" | base64 --decode > "$store"
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$signer" sign --ks "$store" --ks-key-alias lichtbild --ks-pass env:SIGNING_PASSWORD --out lichtbild.apk app/build/outputs/apk/release/app-release-unsigned.apk
          "$signer" verify --verbose --print-certs lichtbild.apk
          expected=$(cat signing-cert.sha256)
          actual=$("$signer" verify --print-certs lichtbild.apk | awk '/certificate SHA-256 digest:/{print $NF}')
          test "$expected" = "$actual"
      - uses: actions/upload-artifact@v7.0.2
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: Lichtbild-Release
          path: lichtbild.apk

  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: lichtbild-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          name: Lichtbild-Release
      - name: Version mit APK und Changelog veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          [[ "$version" =~ ^[0-9]+(\.[0-9]+)+$ ]]
          tag="v$version"
          notes="release-notes/$tag.md"
          test -s "$notes"
          if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq lichtbild.apk; then
            echo "$tag ist bereits veröffentlicht."
          else
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" lichtbild.apk
            else
              gh release create "$tag" lichtbild.apk --target "$GITHUB_SHA" --title "Lichtbild $version" --notes-file "$notes"
            fi
          fi
