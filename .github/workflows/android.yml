name: Android
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug :app:assembleRelease
      - name: Release signieren
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          SIGNING_STORE_B64: ${{ secrets.SIGNING_STORE_B64 }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          store="$RUNNER_TEMP/lichtbild.p12"
          trap 'rm -f "$store"' EXIT
          printf '%s' "$SIGNING_STORE_B64" | base64 --decode > "$store"
          signer="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$signer" sign --ks "$store" --ks-key-alias lichtbild --ks-pass env:SIGNING_PASSWORD --out Lichtbild.apk app/build/outputs/apk/release/app-release-unsigned.apk
          "$signer" verify --verbose --print-certs Lichtbild.apk
          expected=$(cat signing-cert.sha256)
          actual=$("$signer" verify --print-certs Lichtbild.apk | awk '/certificate SHA-256 digest:/{print $NF}')
          test "$expected" = "$actual"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        with:
          name: Lichtbild-Release
          path: Lichtbild.apk
